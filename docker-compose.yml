# Eine App-Instanz (wichtig für den Live-Hub) + Caddy für HTTPS.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - appdata:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  appdata:
  caddy_data:
  caddy_config:
